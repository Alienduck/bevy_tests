[workspace]
resolver = "2"
members = [
    "crates/player",
    "crates/camera"
]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
bevy = { version = "0.20.0", features = []}
avian3d = "0.8.0"
bevy_grass = "0.20.3"

player = { path = "crates/player" }
camera = { path = "crates/camera"}

[package]
name = "bevy_tests"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bevy_tests"
path = "src/main.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { workspace = true }
player = { workspace = true }
avian3d = { workspace = true }
bevy_grass = { workspace = true }
